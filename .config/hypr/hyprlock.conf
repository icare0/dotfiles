# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf

$font = CaskaydiaCove Nerd Font

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(ffffffff) rgba(e5e5e5ee) 45deg
    check_color = rgba(fafafaff) rgba(d0d0d0ee) 120deg
    fail_color = rgba(edededff) rgba(a8a8a8ee) 40deg

    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL$FPRINTFAIL

    # check_text = Authenticating...
    # dots_text_format = *
    dots_size = 0.2
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 70
    font_family = Iosevka

    position = 0, -130
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 16
    font_family = $font

    position = 0, -250
    halign = center
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    font_size = 14
    onclick = hyprctl switchxkblayout all next

    position = 0, -70
    halign = center
    valign = center
}

# ALBUM ART
image {
    monitor =
    path = /tmp/hyprlock_cover.png
    size = 130
    rounding = 16
    border_size = 2
    border_color = rgba(255, 255, 255, 0.25)
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/album-art.sh

    position = 0, -220
    halign = center
    valign = center
}

# MUSIC TRACK TITLE
label {
    text = cmd[update:1000] ~/.config/hypr/scripts/now-playing.sh

    position = 0, -315
    halign = center
    valign = center

    font_size = 14
    font_family = $font
    color = rgba(240, 240, 250, 0.9)
}

# MUSIC CONTROLS
label {
    text = 󰒮
    position = -45, -360
    halign = center
    valign = center
    font_size = 22
    font_family = "JetBrainsMono Nerd Font"
    color = rgba(255, 255, 255, 0.8)
    onclick = playerctl previous
}

label {
    text = 󰐎
    position = 0, -360
    halign = center
    valign = center
    font_size = 24
    font_family = "JetBrainsMono Nerd Font"
    color = rgba(255, 255, 255, 0.95)
    onclick = playerctl play-pause
}

label {
    text = 󰒭
    position = 45, -360
    halign = center
    valign = center
    font_size = 22
    font_family = "JetBrainsMono Nerd Font"
    color = rgba(255, 255, 255, 0.8)
    onclick = playerctl next
}

label {
    text = cmd[update:500] ~/.config/hypr/scripts/password-cursor.sh

    position = 0, 2
    halign = center
    valign = center

    font_size = 18
    font_family = $font
    color = rgba(ffffffff)
}
