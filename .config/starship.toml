# ~/.config/starship.toml
# Tokyo Night theme for Starship Prompt

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$cmd_duration\
$battery\
$line_break\
$character"""

# Directory
[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold #7AA2F7"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = true

# Git branch
[git_branch]
symbol = "󰘬 "
format = "[$symbol$branch]($style) "
style = "bold #BB9AF7"

# Git status
[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "#E0AF68"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "󰋗 "
stashed = "󰀼 "
modified = "󱗜 "
staged = "󰐖 "
renamed = "󰑕 "
deleted = "󰮈 "

# Languages
[python]
symbol = "󰌠 "
format = "[$symbol($version )]($style)"
style = "#7DCFFF"

[nodejs]
symbol = "󰎙 "
format = "[$symbol($version )]($style)"
style = "#9ECE6A"

[rust]
symbol = "󱘗 "
format = "[$symbol($version )]($style)"
style = "#FF9E64"

[golang]
symbol = "󰟓 "
format = "[$symbol($version )]($style)"
style = "#7DCFFF"

[c]
symbol = " "
format = "[$symbol($version )]($style)"
style = "#7AA2F7"

# Command duration
[cmd_duration]
min_time = 2_000
format = "󱎫 [$duration]($style) "
style = "bold #E0AF68"

# Battery (Laptop)
[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 30
style = "bold #F7768E"

# Character prompt
[character]
success_symbol = "[❯](bold #7AA2F7)"
error_symbol = "[❯](bold #F7768E)"
vimcmd_symbol = "[❮](bold #9ECE6A)"
