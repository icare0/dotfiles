# Font — JetBrainsMono Nerd Font is installed by packages.txt
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# Window
window_padding_width   12 16
confirm_os_window_close 0

# Cursor
cursor_shape           beam
cursor_blink_interval  0.5
cursor_trail           1

# Transparency — pairs with Hyprland's blur on the layer
background_opacity 0.85

# Colors — Tokyo Night Moon style
background #0f0f14
foreground #c0caf5
selection_background #283457
selection_foreground #c0caf5

# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

